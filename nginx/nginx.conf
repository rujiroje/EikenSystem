# ──────────────────────────────────────────────────────────────
#  Eikensystem backend  (Spring Boot :8090)
# ──────────────────────────────────────────────────────────────
upstream eiken_backend {
    server localhost:8090;
}

# ──────────────────────────────────────────────────────────────
#  IT Asset backend (Node.js / Java :8080)
# ──────────────────────────────────────────────────────────────
upstream itasset_backend {
    server localhost:8080;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;

    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── redirect root → /eiken/ ─────────────────────────────
    location = / {
        return 302 /eiken/;
    }

    # ════════════════════════════════════════════════════════
    #  EIKENSYSTEM  →  https://server/eiken/
    # ════════════════════════════════════════════════════════

    # API proxy: ตัด prefix /eiken แล้วส่งต่อให้ Spring Boot
    # /eiken/api/auth/login  →  http://eiken_backend/api/auth/login
    location /eiken/api/ {
        proxy_pass         http://eiken_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Health check
    location /eiken/health {
        proxy_pass       http://eiken_backend/health;
        proxy_set_header Host $host;
    }

    # Frontend static files (SPA) — copy frontend/dist/* → /var/www/eiken/
    # vite.config.ts ใช้ base: '/eiken/' ทำให้ assets อยู่ที่ /eiken/assets/...
    location /eiken/ {
        alias  /var/www/eiken/;
        index  index.html;
        try_files $uri $uri/ /eiken/index.html;
    }

    # ════════════════════════════════════════════════════════
    #  IT ASSET SYSTEM  →  https://server/itasset/
    # ════════════════════════════════════════════════════════

    # IT Asset System (Node.js / Java :8080)
    location /itasset/ {
        proxy_pass         http://itasset_backend/itasset/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
