# ──────────────────────────────────────────────────────────────
#  Eikensystem backend (Spring Boot :8090)
# ──────────────────────────────────────────────────────────────
upstream eiken_backend {
    server localhost:8090;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/ssl/certs/itasset.crt;
    ssl_certificate_key /etc/ssl/private/itasset.key;

    # ════════════════════════════════════════════════════════
    #  IT ASSET / PORTAL  (เดิม — ไม่เปลี่ยน)
    # ════════════════════════════════════════════════════════

    root /var/www/portal;
    index index.html;

    # index.html ห้าม cache
    location = /index.html {
        add_header Cache-Control 'no-store, no-cache, must-revalidate';
        try_files $uri /index.html;
    }

    # Assets (JS/CSS hash filename) — cache ได้นาน
    location /assets/ {
        add_header Cache-Control 'public, max-age=31536000, immutable';
    }

    location /api/itasset/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/co2/ {
        proxy_pass http://127.0.0.1:8081/api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ════════════════════════════════════════════════════════
    #  EIKENSYSTEM  →  https://server/eiken/
    # ════════════════════════════════════════════════════════

    # API proxy: ตัด /eiken prefix แล้วส่งต่อ Spring Boot :8090
    # /eiken/api/auth/login  →  localhost:8090/api/auth/login
    location /eiken/api/ {
        proxy_pass         http://eiken_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Health check
    location /eiken/health {
        proxy_pass       http://eiken_backend/health;
        proxy_set_header Host $host;
    }

    # Frontend static (SPA) — copy frontend/dist/* → /var/www/eiken/
    location /eiken/ {
        alias  /var/www/eiken/;
        index  index.html;
        try_files $uri $uri/ /eiken/index.html;
    }

    # ════════════════════════════════════════════════════════
    #  Portal SPA fallback (ต้องอยู่หลังสุด)
    # ════════════════════════════════════════════════════════
    location / {
        try_files $uri $uri/ /index.html;
    }
}
