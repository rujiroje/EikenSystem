# ──────────────────────────────────────────────────────────────
#  Eikensystem backend  (Spring Boot :8090)
# ──────────────────────────────────────────────────────────────
upstream eiken_backend {
    server localhost:8090;
}

# ──────────────────────────────────────────────────────────────
#  IT Asset backend — แก้ PORT ให้ตรงกับระบบ IT Asset ที่มีอยู่
#  ถ้า IT Asset เป็น static files ให้ comment upstream นี้ออก
# ──────────────────────────────────────────────────────────────
# upstream itasset_backend {
#     server localhost:PORT_OF_ITASSET;
# }

# HTTP → HTTPS redirect
server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;

    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── redirect root → /eiken/ ─────────────────────────────
    location = / {
        return 302 /eiken/;
    }

    # ════════════════════════════════════════════════════════
    #  EIKENSYSTEM  →  https://server/eiken/
    # ════════════════════════════════════════════════════════

    # API proxy: ตัด prefix /eiken แล้วส่งต่อให้ Spring Boot
    # /eiken/api/auth/login  →  http://eiken_backend/api/auth/login
    location /eiken/api/ {
        proxy_pass         http://eiken_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Health check
    location /eiken/health {
        proxy_pass       http://eiken_backend/health;
        proxy_set_header Host $host;
    }

    # Frontend static files (SPA) — npm run build → frontend/dist/
    # vite.config.ts ใช้ base: '/eiken/' ทำให้ assets อยู่ที่ /eiken/assets/...
    location /eiken/ {
        alias  /usr/share/nginx/eiken/;
        index  index.html;
        try_files $uri $uri/ /eiken/index.html;
    }

    # ════════════════════════════════════════════════════════
    #  IT ASSET SYSTEM  →  https://server/itasset/
    # ════════════════════════════════════════════════════════

    # ── ตัวเลือก A: IT Asset เป็น App Server (Node/Java/Python/etc.) ──
    # ปลด comment และแก้ PORT ให้ถูกต้อง
    # location /itasset/ {
    #     proxy_pass         http://localhost:PORT/;
    #     proxy_http_version 1.1;
    #     proxy_set_header   Host              $host;
    #     proxy_set_header   X-Real-IP         $remote_addr;
    #     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header   X-Forwarded-Proto $scheme;
    #     proxy_read_timeout 60s;
    # }

    # ── ตัวเลือก B: IT Asset เป็น Static Files ──
    # วาง files ไว้ที่ /usr/share/nginx/itasset/ แล้วปลด comment นี้
    # location /itasset/ {
    #     alias  /usr/share/nginx/itasset/;
    #     index  index.html;
    #     try_files $uri $uri/ /itasset/index.html;
    # }
}
